<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121823;
      --text: #e8eefb;
      --muted: #8b98b3;
      --accent: #4f8cff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(79, 140, 255, 0.14), transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      user-select: none;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      padding: 24px;
    }
    .mark {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
    .status { margin: 0; font-size: 13px; color: var(--muted); min-height: 18px; }
    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .actions { display: flex; gap: 10px; -webkit-app-region: no-drag; }
    .footer { margin-top: 4px; -webkit-app-region: no-drag; }
    button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
    button.ghost:hover { color: var(--text); border-color: transparent; }
    button {
      font: inherit;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }
    button:hover { border-color: rgba(255,255,255,0.25); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .hidden { display: none !important; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #b8c7e8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <img src="../assets/icon.png" alt="DeepSeek Harness" />
    </div>
    <h1>DeepSeek Harness</h1>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Starting the backend…</p>
    <div class="actions hidden" id="actions">
      <button id="retry">Retry</button>
      <button id="logs" class="primary">Open Logs</button>
    </div>
    <div class="footer">
      <button id="connections" class="ghost">Connections…</button>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status')
    const spinnerEl = document.getElementById('spinner')
    const actionsEl = document.getElementById('actions')

    function setStatus(text, { error = false } = {}) {
      statusEl.textContent = text
      spinnerEl.classList.toggle('hidden', error)
      actionsEl.classList.toggle('hidden', !error)
    }

    if (window.dshDesktop) {
      window.dshDesktop.onStatus((status) => {
        if (!status) return
        if (status.state === 'starting') {
          setStatus('Starting · ' + (status.mode || 'Local') + '…')
        } else if (status.state === 'ready') {
          setStatus('Connected · ' + status.url)
        } else if (status.state === 'error') {
          setStatus((status.mode ? status.mode + ': ' : '') + (status.message || 'unknown'), { error: true })
        } else if (status.state === 'exited') {
          setStatus('Backend stopped unexpectedly. Retrying…', { error: true })
        }
      })

      document.getElementById('retry').addEventListener('click', () => {
        setStatus('Restarting the backend…')
        window.dshDesktop.restart()
      })
      document.getElementById('logs').addEventListener('click', async () => {
        const info = await window.dshDesktop.info()
        if (info && info.settingsFile) {
          window.dshDesktop.openExternal('file://' + encodeURI(info.settingsFile.replace('/settings.json', '/logs/backend.log')))
        }
      })
      document.getElementById('connections').addEventListener('click', () => {
        window.dshDesktop.openConnections()
      })
    } else {
      setStatus('Waiting for the desktop bridge…')
    }
  </script>
</body>
</html>
